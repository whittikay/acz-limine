timeout: 5
default_entry: 0
remember_last_entry: yes

# CachyOS Limine theme (modified by whittikay)
# Author: diegons490 (https://github.com/diegons490/cachyos-limine-theme) and whittikay
term_palette: 200b0a;91440a;a47f13;af8813;783818;8b3908;c09a15;cca817
term_palette_bright: 480808;984f0c;bd8c12;d5aa1c;985d0d;91440a;cca817;d5aa1c
term_background: ff000000
term_foreground: c09a15
term_background_bright: d5aa1c
term_foreground_bright: 91440a
interface_branding_colour: cca817
interface_help_colour: a47f13
inferface_help_colour_bright: cca817
interface_resolution: 3840x2160
wallpaper_style: stretched
# Put your wallpaper on the ESP and adjust the filename below.
# The optional #<sha256> suffix is generated by limine-entry-tool; omit it if you don't need integrity checking.
wallpaper: boot():/acz-limine.png

/+CachyOS
  //linux-cachyos
  ### This kernel entry is auto-generated by limine-entry-tool
  ### <machine-id> is your /etc/machine-id: limine-entry-tool places the kernel under boot():/<machine-id>/ on the ESP.
  ### Replace <machine-id>, <root-uuid> and the kernel version with values from your own system.
  comment: Kernel version: <kernel-version>
  comment: kernel-id=linux-cachyos
  protocol: linux
  module_path: boot():/<machine-id>/linux-cachyos/initramfs
  path: boot():/<machine-id>/linux-cachyos/vmlinuz
  cmdline: quiet nowatchdog splash rw rootflags=subvol=/@ root=UUID=<root-uuid>

     //Snapshots
     ### Auto-generated by limine-snapper-sync (one entry per snapper snapshot; omitted from this example)

/+Other systems and bootloaders
//Windows Boot Manager
	protocol: efi_chainload
	image_path: guid(<your-esp-guid>):/efi/Microsoft/Boot/bootmgfw.efi
/EFI fallback
### This EFI entry is auto-generated by limine-entry-tool
comment: Default EFI loader
comment: order-priority=10 
protocol: efi
path: boot():/EFI/BOOT/BOOTX64.EFI
